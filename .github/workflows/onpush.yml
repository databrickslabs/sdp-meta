name: build
on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-results:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        # mcp>=1 requires Python 3.10 or newer.
        python-version: ['3.10']
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
          cache-dependency-path: |
            setup.py
            requirements-dev.txt

      # tests/test_bundle.py::EndToEndRenderTests shells out to
      # `databricks bundle init` to render the real template, and skips itself
      # via skipUnless(shutil.which("databricks")) when the CLI is absent.
      # ubuntu-latest does not ship it, so without this step those tests
      # silently skip on every run. The CLI version follows the pinned action
      # (currently 1.10.0).
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@cfd9223558b9082c2aabb0c8fa47f1c3db2b7cbd # v1.16.1

      - name: Install pip
        run: python -m pip install --upgrade pip

      # The MCP server is part of the measured src/ tree. Install its optional
      # runtime so tests/test_mcp_server.py runs instead of skipping MCP tests.
      - name: Install package and dependencies
        run: pip install -e ".[dev,mcp]"

      # tests/test_app_*.py import databricks_app, whose runtime deps (flask,
      # ...) are declared here rather than in setup.py's [dev] extra. Without
      # this, those modules fail at COLLECTION with ModuleNotFoundError, which
      # aborts pytest with exit code 2 and skips the coverage steps entirely.
      - name: Install Databricks App dependencies
        run: pip install -r databricks_app/requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Install psutil
        run: pip install psutil      

      - name: Lint
        run: flake8        

      - name: Set environment variables
        run: |
          echo "SPARK_LOCAL_IP=127.0.0.1" >> $GITHUB_ENV
          echo "SPARK_EXECUTOR_MEMORY=8g" >> $GITHUB_ENV
          echo "SPARK_DRIVER_MEMORY=8g" >> $GITHUB_ENV
          echo "JAVA_OPTS=-Xmx10g -XX:+UseG1GC" >> $GITHUB_ENV

      - name: Print System Information
        run: | 
               python -c "import psutil; import os;
               print(f'Physical Memory: {psutil.virtual_memory().total / 1e9:.2f} GB'); print(f'CPU Cores: {os.cpu_count()}')"
 
      - name: Run Unit Tests
        run: python -m coverage run -m pytest tests/ -v

      - name: Enforce branch-aware coverage floor
        run: python -m coverage report --precision=2 --fail-under=90

      - name: Generate coverage XML
        run: python -m coverage xml -o coverage.xml

      - name: Publish test coverage
        if: startsWith(matrix.os,'ubuntu')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          verbose: true
 
