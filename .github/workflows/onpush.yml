name: build
on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-results:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        # mcp>=1 requires Python 3.10 or newer.
        python-version: ['3.10']
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
          cache-dependency-path: |
            setup.py
            requirements-dev.txt

      # tests/test_bundle.py::EndToEndRenderTests shells out to
      # `databricks bundle init` to render the real template, and skips itself
      # via skipUnless(shutil.which("databricks")) when the CLI is absent.
      # ubuntu-latest does not ship it, so without this step those tests
      # silently skip on every run. The CLI version follows the pinned action
      # (currently 1.10.0).
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@cfd9223558b9082c2aabb0c8fa47f1c3db2b7cbd # v1.16.1

      - name: Install pip
        run: python -m pip install --upgrade pip

      # The MCP server is part of the measured src/ tree. Install its optional
      # runtime so tests/test_mcp_server.py runs instead of skipping MCP tests.
      - name: Install package and dependencies
        run: pip install -e ".[dev,mcp]"

      # tests/test_app_*.py import databricks_app, whose runtime deps (flask,
      # ...) are declared here rather than in setup.py's [dev] extra. Without
      # this, those modules fail at COLLECTION with ModuleNotFoundError, which
      # aborts pytest with exit code 2 and skips the coverage steps entirely.
      - name: Install Databricks App dependencies
        run: pip install -r databricks_app/requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Install psutil
        run: pip install psutil      

      - name: Lint
        run: flake8        

      - name: Set environment variables
        run: |
          echo "SPARK_LOCAL_IP=127.0.0.1" >> $GITHUB_ENV
          echo "SPARK_EXECUTOR_MEMORY=8g" >> $GITHUB_ENV
          echo "SPARK_DRIVER_MEMORY=8g" >> $GITHUB_ENV
          echo "JAVA_OPTS=-Xmx10g -XX:+UseG1GC" >> $GITHUB_ENV

      - name: Print System Information
        run: | 
               python -c "import psutil; import os;
               print(f'Physical Memory: {psutil.virtual_memory().total / 1e9:.2f} GB'); print(f'CPU Cores: {os.cpu_count()}')"
 
      - name: Run Unit Tests
        run: python -m coverage run -m pytest tests/ -v

      - name: Enforce branch-aware coverage floor
        run: python -m coverage report --precision=2 --fail-under=90

      - name: Generate coverage XML
        run: python -m coverage xml -o coverage.xml

      - name: Publish test coverage
        if: startsWith(matrix.os,'ubuntu')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          verbose: true

  # Build and install both release distributions with dependencies on every
  # interpreter advertised by python_requires/classifiers. This catches
  # metadata contradictions such as advertising Python 3.8 while a required
  # dependency only publishes Python 3.10+ wheels.
  dependency-resolution:
    name: dependency-resolution (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/primary .
          python -m build --wheel --outdir dist/compat compat

      - name: Resolve, install, and import both distributions
        run: |
          verify_env="$(mktemp -d)"
          python -m venv "${verify_env}"
          "${verify_env}/bin/python" -m pip install --upgrade pip
          "${verify_env}/bin/python" -m pip install \
            dist/primary/databricks_labs_sdp_meta-*.whl \
            dist/compat/dlt_meta-*.whl
          (
            cd /tmp
            "${verify_env}/bin/python" - <<'PY'
          import warnings
          warnings.simplefilter("ignore", DeprecationWarning)

          import databricks.labs.sdp_meta
          import dlt_meta

          print("primary and compatibility wheel imports succeeded")
          PY
          )

  # The package metadata must never admit an SDK older than the generated
  # models used by serverless onboarding jobs. Keep this job pinned to the
  # declared floor so the main test job's latest compatible SDK cannot hide
  # an accidental lower-bound regression.
  minimum-sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install package with minimum supported SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "databricks-sdk==0.138.0"

      - name: Exercise serverless job environment models
        run: |
          python - <<'EOF'
          from importlib.metadata import version

          from databricks.sdk.service import compute, jobs

          assert version("databricks-sdk") == "0.138.0"
          environment = jobs.JobEnvironment(
              environment_key="Default",
              spec=compute.Environment(
                  client="1",
                  dependencies=["databricks-labs-sdp-meta"],
              ),
          )
          assert environment.as_dict() == {
              "environment_key": "Default",
              "spec": {
                  "client": "1",
                  "dependencies": ["databricks-labs-sdp-meta"],
              },
          }
          print("minimum Databricks SDK smoke test OK")
          EOF

  # Guards the compat shim's hard invariant: the dlt_meta.pth startup hook
  # must never write anything to stderr, whatever the environment lacks —
  # no pyspark, not even the shim's own runtime deps. site.py prints any
  # exception a .pth line raises on EVERY python launch, and v0.1.0 shipped
  # exactly that bug for machines without pyspark (the
  # ModuleNotFoundError name='pyspark' shape escaped the optional-runtime
  # predicate). The main test job can't catch this class of bug because it
  # installs [dev] (which includes pyspark) and never executes the .pth in
  # a fresh interpreter.
  compat-startup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Build main and compat wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/wheels .
          python -m build --wheel --outdir /tmp/wheels compat

      - name: Install both wheels into a bare venv (no deps, no pyspark)
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet --no-deps /tmp/wheels/*.whl

      - name: Interpreter startup must be silent
        run: |
          err=$(/tmp/bare/bin/python -c "print('ok')" 2>&1 >/dev/null)
          if [ -n "$err" ]; then
            echo "python startup wrote to stderr (dlt_meta.pth leaked):"
            echo "$err"
            exit 1
          fi

      - name: import dlt_meta must not raise and must stub actionably
        run: |
          /tmp/bare/bin/python - <<'EOF'
          import warnings
          warnings.simplefilter("ignore", DeprecationWarning)
          import dlt_meta  # must not raise, whatever is missing
          try:
              dlt_meta.DataflowPipeline
          except ImportError as exc:
              assert "Original error" in str(exc), str(exc)
          else:
              raise SystemExit("expected an actionable ImportError stub")
          import src.dataflow_pipeline  # legacy alias must resolve to a stub
          print("compat startup smoke OK")
          EOF
 
