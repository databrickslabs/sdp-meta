name: release

# Hardened release pipeline per the FE → PyPI.org release doc:
#   authorize → build → scan (fail-closed) → publish → github-release
# Controls: actor allowlist, least-privilege per job, SHA-pinned actions,
# hash-pinned build deps, SLSA provenance (generated at build, verified before
# publish), SBOM/IoC scan gating publish, tag/version agreement check,
# OIDC Trusted Publishing (no stored tokens).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semantic version tags only, e.g. v0.1.0
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run build + scan but skip PyPI upload and GitHub Release."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions: {}          # least privilege at the top; grant per-job below

jobs:
  # ------------------------------------------------------------------
  # 1) Gate: only allowlisted actors may release.
  #    This is a speed bump, not the enforcing control -- anyone with write
  #    access can edit the list. The real gate is the `release` environment's
  #    required reviewers, which the publish job runs under.
  # ------------------------------------------------------------------
  authorize:
    name: Check actor authorization
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED="ravi-databricks"   # TODO: add other release DRIs, comma-separated
          if [[ ",${ALLOWED}," != *",${ACTOR},"* ]]; then
            echo "ERROR: Actor '${ACTOR}' is not authorized to release."; exit 1
          fi

  # ------------------------------------------------------------------
  # 2) Build both wheels on the protected runner.
  #    Build deps are hash-pinned; build runs with --no-isolation so
  #    nothing is fetched from pypi.org at build time.
  # ------------------------------------------------------------------
  build:
    name: Build sdp-meta packages
    needs: authorize
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write                # SLSA attestation signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install build deps (hash-pinned)
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: \
            -r .github/requirements-build.txt

      - name: Build primary package (databricks-labs-sdp-meta)
        run: python -m build --no-isolation --outdir dist/primary

      - name: Verify primary wheel assets and import
        run: |
          wheel="$(printf '%s\n' dist/primary/databricks_labs_sdp_meta-*.whl)"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist/primary").glob("databricks_labs_sdp_meta-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "databricks/labs/sdp_meta/mcp_server.py",
              "databricks/labs/sdp_meta/_packaged_examples/json/cloudfiles-onboarding.template",
              "databricks/labs/sdp_meta/_packaged_examples/yml/cloudfiles-onboarding.template.yml",
              "databricks/labs/sdp_meta/templates/dab/databricks_template_schema.json",
              "databricks/labs/sdp_meta/templates/dab/template/{{.bundle_name}}/README.md.tmpl",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"MCP wheel assets missing: {sorted(missing)}")
          if any(name.startswith("databricks/labs/sdp_meta/mcp/") for name in names):
              raise SystemExit("Removed sdp_meta.mcp package would shadow the MCP SDK")
          PY
          verify_env="$(mktemp -d)"
          python -m venv "${verify_env}"
          "${verify_env}/bin/python" -m pip install --no-deps "${wheel}"
          (
            cd /tmp
            "${verify_env}/bin/python" - <<'PY'
          from importlib.resources import files
          import databricks.labs.sdp_meta
          import databricks.labs.sdp_meta._packaged_examples

          root = files("databricks.labs.sdp_meta._packaged_examples")
          templates = [
              path
              for directory in ("json", "yml")
              for path in root.joinpath(directory).rglob("*")
              if path.is_file()
          ]
          if len(templates) != 34:
              raise SystemExit(
                  f"Installed MCP package exposes {len(templates)} templates, expected 34"
              )
          print("primary wheel import and packaged assets verified")
          PY
          )

      - name: Build compat redirect (dlt-meta)
        working-directory: compat
        run: python -m build --no-isolation --outdir ../dist/compat

      - name: Verify compatibility wheel import and startup
        run: |
          verify_env="$(mktemp -d)"
          python -m venv "${verify_env}"
          "${verify_env}/bin/python" -m pip install --no-deps \
            dist/primary/databricks_labs_sdp_meta-*.whl \
            dist/compat/dlt_meta-*.whl
          err=$("${verify_env}/bin/python" -c "print('ok')" 2>&1 >/dev/null)
          if [[ -n "${err}" ]]; then
            echo "python startup wrote to stderr after wheel installation:"
            echo "${err}"
            exit 1
          fi
          (
            cd /tmp
            "${verify_env}/bin/python" - <<'PY'
          import warnings
          warnings.simplefilter("ignore", DeprecationWarning)

          import databricks.labs.sdp_meta
          import dlt_meta
          import src.dataflow_pipeline

          print("primary and compatibility wheel imports verified")
          PY
          )

      # A tag is the only thing that names the release, but the versions live
      # in setup.py. Without this, tagging v0.2.0 would happily publish 0.1.0.
      - name: Verify tag matches built version
        # Any tag ref, regardless of trigger: a workflow_dispatch re-run on a
        # tag with dry-run=false reaches `publish` too, and skipping the check
        # there would let a stale setup.py version ship under a newer tag
        # (worse: skip-existing would silently skip the upload and the GitHub
        # Release would carry the old artifacts under the new tag name).
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="${TAG_NAME#v}"
          for whl in dist/primary/databricks_labs_sdp_meta-*.whl dist/compat/dlt_meta-*.whl; do
            # Wheel filename: {name}-{version}-{python}-{abi}-{platform}.whl
            actual="$(basename "$whl" | cut -d- -f2)"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: tag '${TAG_NAME}' implies version '${expected}', but"
              echo "       $(basename "$whl") was built as version '${actual}'."
              exit 1
            fi
          done
          echo "OK: both packages built as version ${expected}."

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/primary/*
            dist/compat/*

      - name: Upload built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdp-meta-dist
          path: dist/
          if-no-files-found: error

  # ==================================================================
  # 3) SBOM / IoC scan — fail-closed: a finding blocks publish.
  #    databricks/gh-action-scan is enterprise-shared; a bare,
  #    SHA-pinned `uses:` resolves with the default GITHUB_TOKEN.
  #    (Prereq: SBOM scanner GitHub App installed on databrickslabs
  #     AND scoped to this repo.)
  # ==================================================================
  scan:
    name: SBOM / IoC scan
    needs: build
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdp-meta-dist
          path: dist/

      # Internal enterprise-shared action; no public tags to reference, so the
      # SHA is the only version identifier.
      - name: Security scan
        uses: databricks/gh-action-scan@0fad8d011cec1d3db35bf32b6b4ace57baec8f1d
        with:
          artifact-path: dist/
          artifact-name: sdp-meta

  # ==================================================================
  # 4) Publish to PyPI — needs: [build, scan] so a failed scan blocks
  #    the release. OIDC Trusted Publishing; no stored API token.
  #    Skipped for dry runs and for anything that is not a tag.
  # ==================================================================
  publish:
    name: Publish to PyPI
    needs: [build, scan]
    # Tag-gated: a `workflow_dispatch` with dry-run=false must not be able to
    # publish an arbitrary branch to PyPI.
    if: >-
      ${{ github.ref_type == 'tag'
          && (github.event_name == 'push' || inputs.dry-run == false) }}
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 30
    environment: release             # Trusted Publisher is bound to this
    permissions:
      contents: read
      id-token: write                # PyPI OIDC Trusted Publishing
      attestations: read             # verify the build job's provenance
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          sparse-checkout: .github/scripts

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdp-meta-dist
          path: dist/

      # Closes the loop on the provenance generated in `build`: proves these
      # exact files came out of this repo's workflow before they reach PyPI.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # gh attestation verify takes exactly ONE subject per invocation.
          shopt -s nullglob
          files=(dist/primary/* dist/compat/*)
          (( ${#files[@]} > 0 )) || { echo "ERROR: no artifacts to verify"; exit 1; }
          for f in "${files[@]}"; do
            echo "Verifying $(basename "$f") ..."
            gh attestation verify "$f" --repo "$REPO"
          done

      # Mints a short-lived, project-scoped PyPI token from this job's
      # GitHub OIDC token and discards it — proves the Trusted Publisher
      # matches this repo/workflow/environment before any upload.
      - name: Verify PyPI auth (OIDC Trusted Publishing — no upload)
        run: bash .github/scripts/pypi-verify-auth.sh

      # skip-existing makes a rerun idempotent: if the compat upload fails
      # after the primary succeeded, rerunning this job skips the
      # already-published primary files instead of erroring on them.
      - name: Publish databricks-labs-sdp-meta to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/primary
          skip-existing: true

      - name: Publish dlt-meta compat redirect to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/compat
          skip-existing: true

  # ==================================================================
  # 5) GitHub Release + Sigstore signing — after a successful publish.
  #    contents: write is isolated here, away from the PyPI jobs.
  # ==================================================================
  github-release:
    name: GitHub Release + Sigstore
    needs: publish
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write                # attach artifacts to GitHub Release
      id-token: write                # Sigstore signing
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdp-meta-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/primary/databricks_labs_sdp_meta-*.whl
            dist/primary/databricks_labs_sdp_meta-*.tar.gz
            dist/compat/dlt_meta-*.whl
            dist/compat/dlt_meta-*.tar.gz

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/primary/databricks_labs_sdp_meta-*.whl
            dist/primary/databricks_labs_sdp_meta-*.tar.gz
            dist/compat/dlt_meta-*.whl
            dist/compat/dlt_meta-*.tar.gz
          release-signing-artifacts: true
