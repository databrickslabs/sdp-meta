# `bash -c` form is deliberate: it normalizes CRLF -> LF on start.sh in
# the container BEFORE invoking it. This is belt-and-suspenders defense
# against Windows-origin deploys where the file slipped past .gitattributes
# (e.g. a checkout pre-dating the policy with core.autocrlf=true left
# trailing \r on every line). Without this, line 26 (`set -euo pipefail`)
# crashes with "set: pipefail : invalid option name" -- the literal \r
# at end of the token resets the cursor in the error string.
#
# YAML scalar quoting matters here. We use SINGLE-quoted YAML so the
# only special sequence is '' -> ' (no backslash interpretation). A
# double-quoted YAML scalar would force us to write '\\r' for the sed
# regex; some YAML parsers in the wild (Apps platform has gone through
# at least two of them) interpret '\\r' as backslash+CR rather than
# backslash+r, which silently breaks the regex. Single-quoting sidesteps
# the issue entirely.
#
# `sed -i 's/\r//g'` strips EVERY CR byte (not just trailing) so a file
# with mid-line CRs (rare but possible if the editor history mixed
# encodings) is also healed. `printf` provides an in-band diagnostic so
# the Apps log shows the normalizer ran before start.sh's first line.
# `exec` replaces the bash -c shell with start.sh's bash so PID 1 stays
# correct for the Apps platform's process supervision.
command:
  - 'bash'
  - '-c'
  - 'printf ">>> CRLF normalizer: stripping CRs from start.sh\n"; sed -i ''s/\r//g'' start.sh; printf ">>> exec start.sh\n"; exec bash start.sh'
display_name: "SDP-META"
description: "Metadata-driven Lakeflow Spark Declarative Pipelines"

env:
  # SQL warehouse used by the DataflowSpecs browser and the Metadata → Browse tab.
  # Leave blank ("") to configure the warehouse interactively via the app UI
  # (Warehouse button in the top bar → enter an existing ID or create a new serverless one).
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    value: ""
  # DQX runtime installed into App-created onboarding and pipeline environments.
  - name: SDP_META_QUALITY_ENGINE_DEPENDENCY
    value: "databricks-labs-dqx>=0.14,<0.17"
