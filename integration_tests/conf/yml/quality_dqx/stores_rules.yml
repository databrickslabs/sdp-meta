- name: store_id_required
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: store_id
- name: store_name_required
  criticality: error
  check:
    function: is_not_null_and_not_empty
    arguments:
      column: name
- name: country_warning
  criticality: warn
  check:
    function: is_in_list
    arguments:
      column: country
      allowed:
        - "'US'"
        - "'CA'"
        - "'GB'"
